name: Build Docker image

on:
  workflow_dispatch:
    inputs:
      web_service_ref:
        description: Git ref for Mianotes/mianotes-web-service
        required: false
        default: main
      dashboard_ref:
        description: Git ref for Mianotes/mianotes-dashboard
        required: false
        default: main
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Set build refs
        id: refs
        shell: bash
        run: |
          echo "web_service_ref=${{ github.event.inputs.web_service_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          echo "dashboard_ref=${{ github.event.inputs.dashboard_ref || 'main' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mianotes/mianotes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WEB_SERVICE_REF=${{ steps.refs.outputs.web_service_ref }}
            DASHBOARD_REF=${{ steps.refs.outputs.dashboard_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
