name: Build macOS package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build mianotes.pkg
    runs-on: macos-14
    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build package
        run: ./macos/create_package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianotes-pkg
          path: dist/mianotes.pkg

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mianotes.pkg
