name: Build macOS package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build mianotes.pkg
    runs-on: macos-14
    steps:
      - name: Check out installer
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set signing paths
        run: |
          {
            echo "CERTIFICATE_PATH=$RUNNER_TEMP/developer-id-installer.p12"
            echo "APPLICATION_CERTIFICATE_PATH=$RUNNER_TEMP/developer-id-application.p12"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/mianotes-signing.keychain-db"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "SIGNED_PACKAGE_PATH=$RUNNER_TEMP/mianotes-signed.pkg"
          } >> "$GITHUB_ENV"

      - name: Check Apple signing secrets
        env:
          APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          missing=0
          for name in \
            APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 \
            APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD \
            APPLE_DEVELOPER_ID_INSTALLER_IDENTITY \
            APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 \
            APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD \
            APPLE_DEVELOPER_ID_APPLICATION_IDENTITY \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_BASE64
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Import Developer ID Installer certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          APPLICATION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$APPLICATION_CERTIFICATE_BASE64" | base64 -D > "$APPLICATION_CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security import "$APPLICATION_CERTIFICATE_PATH" \
            -P "$APPLICATION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p basic "$KEYCHAIN_PATH"
          application_identity="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F '"' '/Developer ID Application/ { print $1; exit }' \
              | awk '{ print $2 }'
          )"
          if [[ -z "$application_identity" ]]; then
            echo "::error::No Developer ID Application signing identity was imported."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$application_identity" >> "$GITHUB_ENV"

      - name: Build package
        env:
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          CODESIGN_KEYCHAIN: ${{ env.KEYCHAIN_PATH }}
        run: ./macos/create_package.sh

      - name: Sign package
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          productsign \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            dist/mianotes.pkg \
            "$SIGNED_PACKAGE_PATH"

      - name: Notarize package
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          xcrun notarytool submit "$SIGNED_PACKAGE_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "$SIGNED_PACKAGE_PATH"
          pkgutil --check-signature "$SIGNED_PACKAGE_PATH"
          mv "$SIGNED_PACKAGE_PATH" dist/mianotes.pkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mianotes-pkg
          path: dist/mianotes.pkg

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mianotes.pkg

      - name: Delete temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
